[package]
name = "simoom-sys"
description = "Operating-system layer of simoom: epoll, io_uring, kqueue, IOCP, sockets, SIMD scanning. The only crate with unsafe code."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]

[features]
# The Linux io_uring back end. Without it `Backend::IoUring` falls back to epoll. Off here, so
# the protocol crates that use only the SIMD scan and crypto intrinsics don't switch it on;
# simoom-rt turns it on by default. Test it with `cargo test -p simoom-sys --features io-uring`.
io-uring = []
# SanitizerCoverage edge-counter callbacks for the std-only coverage-guided fuzzer (plan §7.3 F2).
# Test-only; never enable it in a shipped build.
sancov = []
