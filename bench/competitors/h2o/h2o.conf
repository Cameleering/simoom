# Fixed 13-byte reply. A thread per core (num-threads defaults to the CPU count), reuseport,
# no access log, connection limit raised for the idle tests. HTTP/1.1 and h2c on 8080, TLS on
# 8443 (TCP) and HTTP/3 on 8443/udp.
max-connections: 1048576
http2-idle-timeout: 120
http1-request-timeout: 120
# the I/O timeout while a request is read (default 5 s); raised so idle keep-alive tests hold
http1-request-io-timeout: 120
tcp-reuseport: ON
listen:
  port: 8080
listen: &ssl
  port: 8443
  ssl:
    certificate-file: /opt/bench/cert/cert.pem
    key-file: /opt/bench/cert/key.pem
    minimum-version: TLSv1.3
listen:
  <<: *ssl
  type: quic
hosts:
  default:
    paths:
      /:
        header.set: "content-type: text/plain"
        file.dir: /opt/bench/h2o-root
