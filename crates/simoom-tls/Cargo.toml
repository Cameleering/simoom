[package]
name = "simoom-tls"
description = "Sans-io TLS 1.3 server and client for simoom, with QUIC support (RFC 9001)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
simoom-sys = { path = "../simoom-sys" }

[features]
default = ["client", "rsa", "p384", "ed25519", "chacha20"]
# The TLS client (ClientConnection, ClientConfig, QuicConnection::new_client). A server-only
# build can leave it out; the tests, the benchmark and the fuzzer need it.
client = []
# RSA keys and certificates (PSS in the handshake, PKCS#1 v1.5 and PSS in certificates).
rsa = []
# ECDSA P-384 keys and certificates.
p384 = []
# Ed25519 keys and certificates. Also makes X25519 key generation about twice as fast (it then
# uses the Ed25519 fixed-base table instead of the Montgomery ladder).
ed25519 = []
# The TLS_CHACHA20_POLY1305_SHA256 cipher suite (and its QUIC header protection).
# Without these four, a build has X25519, P-256 (ECDH and ECDSA) and AES-GCM: the smallest
# edge build is `--no-default-features`.
chacha20 = []
# TLS 1.2 (RFC 5246) next to TLS 1.3, client and server: ECDHE (X25519, P-256, P-384) with
# AES-GCM and ChaCha20-Poly1305, extended master secret required, session tickets and IDs,
# renegotiation refused, the RFC 8446 downgrade sentinel. QUIC stays TLS 1.3 only.
tls12 = []
# SHA-1, for the formats that still name it (OCSP CertIDs, legacy certificate, CRL and OCSP
# signatures, PKCS#12 and JKS integrity). Never used by the handshake. Implied by the
# key store and revocation features.
sha1 = []
# Key material from files: PEM bundles (also encrypted PKCS#8 keys), the KeyStore type and
# SslContextParameters (Camel's SSLContextParameters). `pkcs12` and `jks` add those formats.
# Legacy primitives only old key-store formats use: MD5, DES/3DES, RC2, and the bitsliced AES
# with CBC for PBES2 (crypto::legacy, moves to saltire). Off in server builds; the key store
# features turn it on.
legacy = ["sha1"]
keystore = ["legacy"]
# PKCS#12 / PFX key stores (PBES2 with PBKDF2 and AES; the legacy PBE-SHA1-3DES/RC2 schemes
# of old files), read and write.
pkcs12 = ["keystore", "sha1"]
# Java JKS and JCEKS key stores, read and write.
jks = ["keystore", "sha1"]
# Revocation: CRLs (parse, verify, check, distribution points), OCSP client checks and OCSP
# stapling (server: status_request in TLS 1.3 and 1.2; client: staple validation).
revocation = ["sha1"]
# A blocking std::io::Read + Write TLS stream over a TcpStream (client and server), with
# timeouts and a lingering close after fatal alerts.
blocking = []

[[example]]
name = "bench_tls"
required-features = ["client", "rsa", "ed25519", "chacha20"]

[[example]]
name = "fuzz_tls"
required-features = ["client"]

# The integration tests use every key type and cipher suite.
[[test]]
name = "handshake"
required-features = ["client", "rsa", "p384", "ed25519", "chacha20"]

[[test]]
name = "interop"
required-features = ["client", "rsa", "p384", "ed25519", "chacha20"]

[[test]]
name = "quic"
required-features = ["client", "rsa", "p384", "ed25519", "chacha20"]

[[test]]
name = "fuzz"
required-features = ["client", "rsa", "p384", "ed25519", "chacha20"]

[[test]]
name = "timing"
required-features = ["client", "rsa", "p384", "ed25519", "chacha20"]

[[test]]
name = "hardening"
# tests/common builds certificates of every key type
required-features = ["client", "rsa", "p384", "ed25519"]

[[test]]
name = "revocation"
required-features = ["revocation", "rsa", "p384", "ed25519"]

[[test]]
name = "fuzzing_revocation"
required-features = ["revocation", "rsa", "p384", "ed25519"]

[[test]]
name = "keystores"
required-features = ["pkcs12", "jks", "rsa", "p384", "ed25519"]

[[test]]
name = "fuzzing_keystore"
required-features = ["pkcs12", "jks"]

[[test]]
name = "tls12"
required-features = ["tls12", "client", "rsa", "p384", "ed25519", "chacha20"]

[[test]]
name = "interop12"
required-features = ["tls12", "client", "rsa", "p384", "ed25519", "chacha20"]

[[test]]
name = "tls_revocation"
required-features = ["revocation", "tls12", "client", "rsa", "p384", "ed25519", "chacha20"]

[[test]]
name = "fuzzing_tls12"
required-features = ["tls12", "client", "rsa", "p384", "ed25519", "chacha20"]

[[test]]
name = "timing_legacy"
required-features = ["pkcs12"]
