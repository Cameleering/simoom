[package]
name = "simoom-h2"
description = "Sans-io HTTP/2 (RFC 9113) connection engine for simoom, with DoS accounting."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["http2", "h2", "sans-io", "rfc9113", "server"]
categories = ["web-programming", "network-programming"]
homepage = "https://github.com/Cameleering/simoom"
documentation = "https://docs.rs/simoom-h2"

[lints]
workspace = true

[dependencies]
simoom-hpack = { path = "../simoom-hpack", version = "0.1.0" }

[features]
default = ["connect-protocol", "keepalive"]
# RFC 8441 extended CONNECT (WebSocket over HTTP/2): `Config::enable_connect_protocol`,
# `Headers::protocol`, `Connection::send_extended_connect`. Without it the option is ignored.
connect-protocol = []
# PING keepalive (`Config::keepalive_interval_ms`). Without it the options are ignored.
keepalive = []
