[package]
name = "bench-axum"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["http1", "http2", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }

[workspace]
# a standalone project outside the simoom workspace, with its own Cargo.lock (CLAUDE.md rule 1 exception)

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
