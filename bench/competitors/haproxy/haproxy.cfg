# Fixed 13-byte reply with `http-request return`. One process, a thread per CPU (nbthread
# defaults to the CPU count since 2.5), one listener per thread group (shards by-thread), as
# HAProxy's management guide suggests for high connection rates.
global
    maxconn 1048576
    tune.bufsize 16384
    no log
defaults
    mode http
    timeout client 120s
    timeout server 120s
    timeout connect 5s
    timeout http-keep-alive 120s
    option http-keep-alive
frontend fixed
    bind :8080 shards by-thread
    bind :8081 shards by-thread proto h2
    bind :8443 shards by-thread ssl crt /opt/bench/cert/haproxy.pem alpn h2,http/1.1 ssl-min-ver TLSv1.3
    http-request return status 200 content-type text/plain string "Hello, World!"
