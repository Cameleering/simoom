[package]
name = "simoom-tls"
description = "Sans-io TLS 1.3 server and client for simoom, with QUIC support (RFC 9001)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
simoom-sys = { path = "../simoom-sys" }

[features]
default = ["client"]
# The TLS client (ClientConnection, ClientConfig, QuicConnection::new_client). A server-only
# build can leave it out; the tests, the benchmark and the fuzzer need it.
client = []

[[example]]
name = "bench_tls"
required-features = ["client"]

[[example]]
name = "fuzz_tls"
required-features = ["client"]
