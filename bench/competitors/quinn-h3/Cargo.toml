[package]
name = "bench-quinn-h3"
version = "0.1.0"
edition = "2021"
publish = false

# HTTP/3 in Rust as it is usually built: h3 over h3-quinn, quinn 0.11, rustls 0.23 (aws-lc-rs).
# axum on 8080 only answers the readiness probe; the measured listener is HTTP/3 on UDP 8443.
[dependencies]
axum = { version = "0.8", features = ["http1", "tokio"] }
bytes = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
quinn = "0.11"
rustls = "0.23"
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }

[workspace]
# a standalone project outside the simoom workspace, with its own Cargo.lock (CLAUDE.md rule 1 exception)

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
