[package]
name = "simoom-h3"
description = "Sans-io HTTP/3 (RFC 9114) for simoom."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["http3", "h3", "quic", "rfc9114", "sans-io"]
categories = ["web-programming", "network-programming"]
homepage = "https://github.com/Cameleering/simoom"
documentation = "https://docs.rs/simoom-h3"

[lints]
workspace = true

[dependencies]
simoom-qpack = { path = "../simoom-qpack", version = "0.1.0" }
simoom-quic = { path = "../simoom-quic", version = "0.1.0", default-features = false }

[dev-dependencies]
simoom-quic = { path = "../simoom-quic" }
simoom-tls = { path = "../simoom-tls" }
