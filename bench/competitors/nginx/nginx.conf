# Fixed 13-byte reply, tuned per nginx's own guidance for high connection counts
# (https://nginx.org/en/docs/ngx_core_module.html, https://www.nginx.com/blog/tuning-nginx/):
# a worker per core, reuseport listeners, no access log, unlimited keep-alive requests.
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 1048576;
pid /run/bench-nginx/nginx.pid;
error_log stderr warn;
daemon off;
events {
    # nginx preallocates the connection array per worker, so this is sized to the largest test
    # (100k idle connections over 4 workers) rather than set very high
    worker_connections 40000;
    use epoll;
    multi_accept on;
}
http {
    access_log off;
    server_tokens off;
    tcp_nodelay on;
    keepalive_timeout 120s;
    keepalive_requests 100000000;
    client_body_temp_path /run/bench-nginx/body;
    server {
        listen 8080 reuseport backlog=65535 default_server;
        listen 8081 reuseport backlog=65535 http2;
        listen 8443 reuseport backlog=65535 ssl http2;
        ssl_certificate /opt/bench/cert/cert.pem;
        ssl_certificate_key /opt/bench/cert/key.pem;
        ssl_protocols TLSv1.3;
        # QUIC-LISTEN
        location = /64k { default_type application/octet-stream; alias /opt/bench/files/64k; }
        location = /1m { default_type application/octet-stream; alias /opt/bench/files/1m; }
        location / {
            default_type text/plain;
            return 200 "Hello, World!";
        }
    }
}
