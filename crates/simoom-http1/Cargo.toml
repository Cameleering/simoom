[package]
name = "simoom-http1"
description = "Sans-io, strict HTTP/1.1 parser and serializer (RFC 9112) for simoom."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
simoom-sys = { path = "../simoom-sys" }
simoom-compress = { path = "../simoom-compress", optional = true }

[features]
default = ["websocket"]
# RFC 6455 handshake and frame codec (adds SHA-1).
websocket = []
# WebSocket permessage-deflate (RFC 7692): negotiation and the per-message codec (`ws::deflate`).
permessage-deflate = ["websocket", "dep:simoom-compress"]
# The coverage-guided fuzzer (`tests/cov_fuzz.rs`); test-only.
sancov = ["simoom-sys/sancov"]
