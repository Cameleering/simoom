[package]
name = "simoom-rt"
description = "simoom runtime: one event loop per core, timer wheel, buffer pools, cross-thread wakeups, offload pool."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["runtime", "event-loop", "io-uring", "epoll", "iocp"]
categories = ["asynchronous", "network-programming"]
homepage = "https://github.com/Cameleering/simoom"
documentation = "https://docs.rs/simoom-rt"

[lints]
workspace = true

[dependencies]
simoom-sys = { path = "../simoom-sys", version = "0.1.0", default-features = false }

[features]
default = ["io-uring", "udp", "idle-trim"]
# The Linux io_uring back end (see simoom-sys). Without it `Backend::IoUring` falls back to epoll.
io-uring = ["simoom-sys/io-uring"]
# UDP endpoints (`Builder::udp`, for QUIC). A build without it carries none of the UDP receive
# and send code.
udp = ["simoom-sys/udp"]
# After a burst, a loop idle for a second frees what its buffer pool and receive stock cached and
# asks the C allocator to return free memory to the OS. A build without it keeps them.
idle-trim = []
