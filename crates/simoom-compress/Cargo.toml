[package]
name = "simoom-compress"
description = "DEFLATE (RFC 1951), zlib (RFC 1950) and gzip (RFC 1952) for simoom: streaming, bounded, std-only."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["deflate", "gzip", "zlib", "compression", "no-std-deps"]
categories = ["compression"]
homepage = "https://github.com/Cameleering/simoom"
documentation = "https://docs.rs/simoom-compress"

[lints]
workspace = true

[dependencies]
# BMI2 kernels picked at run time for Brotli and zstd (the only crate with `unsafe`).
simoom-sys = { path = "../simoom-sys", version = "0.1.0", default-features = false, optional = true }

[features]
default = []
# Brotli (RFC 7932) decoder and encoder, `Format::Brotli`; adds the static dictionary
# (59 KB compressed in the binary).
brotli = ["dep:simoom-sys"]
# zstd (RFC 8878) decoder and encoder, `Format::Zstd`.
zstd = ["dep:simoom-sys"]

[[example]]
name = "bench_compress"
