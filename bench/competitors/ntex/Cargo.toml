[package]
name = "bench-ntex"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ntex = { version = "2", features = ["tokio"] }

[workspace]
# a standalone project outside the simoom workspace, with its own Cargo.lock (CLAUDE.md rule 1 exception)

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
